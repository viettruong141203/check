<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face ID - Tra Cứu Dữ Liệu</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body, html {
      width: 100%; min-height: 100vh;
      background: linear-gradient(135deg, #f3e8ff 0%, #e0e7ff 100%);
      display: flex; justify-content: center; align-items: flex-start; padding: 24px;
    }

    /* Mở rộng thẻ card để chứa bảng dữ liệu */
    .app-card {
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(25px);
      padding: 32px; border-radius: 32px;
      box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 24px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .app-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .header-text h2 { font-size: 1.5rem; font-weight: 800; color: #0F172A; }
    .header-text p { font-size: 0.9rem; color: #64748B; margin-top: 4px; }

    /* Nút làm mới */
    .btn-refresh {
      background: #EEF2FF; color: #6366F1; border: 1px solid #C7D2FE;
      padding: 10px 20px; border-radius: 12px; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease;
    }
    .btn-refresh:hover { background: #6366F1; color: #fff; box-shadow: 0 8px 16px rgba(99, 102, 241, 0.2); }
    .btn-refresh svg { width: 18px; height: 18px; }

    /* Khu vực bảng dữ liệu */
    .table-container {
      width: 100%; overflow-x: auto; background: #F8FAFC; 
      border-radius: 20px; border: 1px solid #E2E8F0;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      background: #F1F5F9; color: #475569; font-weight: 700; font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 0.5px; padding: 16px;
      border-bottom: 2px solid #E2E8F0; white-space: nowrap;
    }
    td {
      padding: 16px; border-bottom: 1px solid #E2E8F0; color: #1E293B;
      font-size: 0.95rem; font-weight: 500;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #F1F5F9; }

    /* Rút gọn dữ liệu AI */
    .code-box {
      background: #E2E8F0; color: #334155; padding: 6px 12px; border-radius: 8px;
      font-family: monospace; font-size: 0.85rem; display: inline-block;
      max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .badge-time {
      background: #ECFDF5; color: #10B981; padding: 6px 12px;
      border-radius: 8px; font-weight: 700; font-size: 0.85rem; border: 1px solid #A7F3D0;
      display: inline-block; white-space: nowrap;
    }

    .badge-id { font-weight: 800; color: #4F46E5; }

    /* Trạng thái Loading */
    .status-box {
      font-size: 0.95rem; font-weight: 600; color: #64748B; text-align: center;
      padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366F1; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <div class="app-card">
    <div class="app-header">
      <div class="header-text">
        <h2>Tra Cứu Dữ Liệu</h2>
        <p>Danh sách mã phân tích khuôn mặt từ hệ thống</p>
      </div>
      <button class="btn-refresh" onclick="fetchData()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        Làm mới
      </button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>STT</th>
            <th>Mã Dữ Liệu (A)</th>
            <th>Thời Gian (B)</th>
            <th>Mã Phân Tích Khuôn Mặt (C)</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Dữ liệu sẽ được đẩy vào đây -->
        </tbody>
      </table>
      
      <!-- Hộp trạng thái -->
      <div id="statusBox" class="status-box">
        <div class="spinner"></div>
        <span>Đang kết nối hệ thống để lấy dữ liệu...</span>
      </div>
    </div>
  </div>

  <script>
    // Điền chính xác API URL của Google Apps Script bạn đã cung cấp
    const API_URL = "https://script.google.com/macros/s/AKfycbzU2-uP0jUUia8w74BBQ7U78OUn3d_SE7cEd_LBZJbq2b2g4HCJyFRAOLKMU9p2zb0F/exec";
    
    const tableBody = document.getElementById('tableBody');
    const statusBox = document.getElementById('statusBox');

    // Hàm gọi dữ liệu từ API
    async function fetchData() {
      // Reset bảng & hiện loading
      tableBody.innerHTML = '';
      statusBox.style.display = 'flex';
      statusBox.innerHTML = '<div class="spinner"></div><span>Đang kết nối hệ thống để lấy dữ liệu...</span>';

      // Tạo payload chuẩn json bạn yêu cầu
      const payload = {
        "sheet": "Face ID",
        "action": "get"
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        // Xử lý khi thành công
        if (result && result.status === "success") {
          const dataList = result.all_data;
          
          if (!dataList || dataList.length === 0) {
            statusBox.innerHTML = '<span>📭 Chưa có dữ liệu nào trong hệ thống.</span>';
            return;
          }

          statusBox.style.display = 'none'; // Ẩn loading
          renderTable(dataList);

        } else {
          throw new Error("Dữ liệu trả về không hợp lệ");
        }
      } catch (error) {
        console.error("Lỗi lấy dữ liệu:", error);
        statusBox.innerHTML = '<span style="color: #F43F5E;">⚠️ Lỗi kết nối đến máy chủ. Vui lòng thử lại sau!</span>';
      }
    }

    // Hàm in dữ liệu ra HTML
    function renderTable(dataList) {
      dataList.forEach(item => {
        const tr = document.createElement('tr');
        
        tr.innerHTML = `
          <td>#${item.row}</td>
          <td class="badge-id">${item.A}</td>
          <td><span class="badge-time">${item.B}</span></td>
          <td><div class="code-box" title="${item.C}">${item.C}</div></td>
        `;
        
        tableBody.appendChild(tr);
      });
    }

    // Chạy tải dữ liệu ngay khi mở trang
    window.onload = fetchData;
  </script>
</body>
</html>
